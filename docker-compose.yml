version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_dialer_db
    environment:
      POSTGRES_USER: dialer_user
      POSTGRES_PASSWORD: dialer_password
      POSTGRES_DB: smart_dialer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dialer_user -d smart_dialer"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart_dialer_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
